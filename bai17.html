<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style17.css">
</head>
<body>
    <div class="container register-container">
        <div class="register-card">
            <h2 class="form-title">Đăng ký tài khoản</h2>
            <p class="form-subtitle">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
            <form id="registerForm" onsubmit="return kiemTraForm()">
                <div class="mb-3">
                    <label for="txtName" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="txtName" placeholder="Nhập họ và tên...">
                    <div id="nameError" class="error-msg" style="display: none;"></div>
                    <div id="nameSuccess" class="success-msg" style="display: none;">✓ Hợp lệ</div>
                </div>
                <div class="mb-3">
                    <label for="txtEmail" class="form-label">Email</label>
                    <input type="text" class="form-control" id="txtEmail" placeholder="Nhập email...">
                    <div id="emailError" class="error-msg" style="display: none;"></div>
                    <div id="emailSuccess" class="success-msg" style="display: none;">✓ Hợp lệ</div>
                </div>
                <div class="mb-3">
                    <label for="txtPassword" class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" id="txtPassword" placeholder="Nhập mật khẩu...">
                    <div id="passError" class="error-msg" style="display: none;"></div>
                </div>
                <div class="mb-4">
                    <label for="txtConfirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control" id="txtConfirmPassword" placeholder="Nhập lại mật khẩu...">
                    <div id="confirmError" class="error-msg" style="display: none;"></div>
                    <div id="confirmSuccess" class="success-msg" style="display: none;">✓ Hợp lệ</div>
                </div>
                <button type="submit" class="btn btn-register">Đăng ký</button>
            </form>
        </div>
        <script src="javascript/bai17.js"></script>
</body>
</html>
