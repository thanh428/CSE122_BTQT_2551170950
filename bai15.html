<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style15.css">
</head>
<body>

    <div class="calculator">
        <div class="screen">
            <div id="expression" class="expression"></div>
            <div id="result" class="result">0</div>
        </div>
        <div class="buttons">
            <button class="btn-calc btn-c" onclick="clearScreen()">C</button>
            <button class="btn-calc btn-op" onclick="toggleBracket()">()</button>
            <button class="btn-calc btn-op" onclick="appendValue('%')">%</button>
            <button class="btn-calc btn-op" onclick="appendValue('÷')">÷</button>

            <button class="btn-calc btn-num" onclick="appendValue('7')">7</button>
            <button class="btn-calc btn-num" onclick="appendValue('8')">8</button>
            <button class="btn-calc btn-num" onclick="appendValue('9')">9</button>
            <button class="btn-calc btn-op" onclick="appendValue('×')">×</button>

            <button class="btn-calc btn-num" onclick="appendValue('4')">4</button>
            <button class="btn-calc btn-num" onclick="appendValue('5')">5</button>
            <button class="btn-calc btn-num" onclick="appendValue('6')">6</button>
            <button class="btn-calc btn-op" onclick="appendValue('-')">-</button>

            <button class="btn-calc btn-num" onclick="appendValue('1')">1</button>
            <button class="btn-calc btn-num" onclick="appendValue('2')">2</button>
            <button class="btn-calc btn-num" onclick="appendValue('3')">3</button>
            <button class="btn-calc btn-op" onclick="appendValue('+')">+</button>

            <button class="btn-calc btn-num btn-zero" onclick="appendValue('0')">0</button>
            <button class="btn-calc btn-num" onclick="appendValue('.')">.</button>
            <button class="btn-calc btn-equals" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="javascript/bai15.js"></script>
</body>
</html>
