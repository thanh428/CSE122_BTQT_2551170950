<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles26.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
    <main class="container">
        <section class="row justify-content-center">
            <article class="col-12 col-md-8 col-lg-7">
                <form class="card shadow border-0 rounded-4 overflow-hidden" novalidate>
                    <header class="card-header bg-success text-white text-center py-3">
                        <h1 class="h4 mb-0">Đăng ký tham gia CLB Lập trình Web</h1>
                    </header>
                    <section class="card-body p-4">
                        <section class="row g-3">
                            <section class="col-md-6">
                                <label for="fullname" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                            </section>
                            <section class="col-md-6">
                                <label for="studentId" class="form-label">Mã sinh viên</label>
                                <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                            </section>
                            <section class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                            </section>
                            <section class="col-md-6">
                                <label for="phone" class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxxx" required>
                            </section>
                            <section class="col-12">
                                <label class="form-label d-block">Trình độ</label>
                                <section class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="level" id="levelBasic" value="Cơ bản" checked>
                                    <label class="form-check-label" for="levelBasic">Cơ bản</label>
                                </section>
                                <section class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="level" id="levelIntermediate" value="Khá">
                                    <label class="form-check-label" for="levelIntermediate">Khá</label>
                                </section>
                                <section class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="level" id="levelAdvanced" value="Tốt">
                                    <label class="form-check-label" for="levelAdvanced">Tốt</label>
                                </section>
                            </section>
                            <section class="col-12">
                                <label for="classSelect" class="form-label">Chọn lớp</label>
                                <select class="form-select" id="classSelect" required>
                                    <option value="67CNTT1" selected>67CNTT1</option>
                                    <option value="67CNTT2">67CNTT2</option>
                                    <option value="67CNTT3">67CNTT3</option>
                                </select>
                            </section>
                            <section class="col-12">
                                <section class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="commitment" required>
                                    <label class="form-check-label" for="commitment">
                                        Tôi cam kết tự làm bài và quay video OBS
                                    </label>
                                </section>
                            </section>
                            <section class="col-12 d-flex justify-content-end gap-2 mt-4">
                                <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                                <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                            </section>
                        </section>
                    </section>
                </form>
            </article>
        </section>
    </main>
    <script src="javascript/bai26.js"></script>
</body>
</html>
