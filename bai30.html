<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE.TLU Admin - Bảng điều khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style30.css">
</head>
<body>

    <section class="d-flex min-vh-100">
        
        <aside class="sidebar p-3 text-white flex-shrink-0">
            <h1 class="h5 font-weight-bold mb-4 ps-2 text-white">CSE.TLU Admin</h1>
            <nav aria-label="Menu chính">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white active" aria-current="page">Bảng điều khiển</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white-50">Bài tập</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white-50">Sinh viên</a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-white-50">Điểm số</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="flex-grow-1 p-4 main-content">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h4 fw-bold text-dark m-0">Bảng điều khiển</h2>
                <nav aria-label="Thao tác nhanh" class="d-flex align-items-center gap-2">
                    <span class="badge bg-warning text-dark px-3 py-2 fw-semibold">3 bài mới</span>
                    <button type="button" class="btn btn-primary btn-sm px-3 py-2">Xuất báo cáo</button>
                </nav>
            </header>

            <section class="row g-3 mb-4">
                
                <article class="col-md-3">
                    <section class="card border-0 shadow-sm p-3 h-100">
                        <h3 class="card-subtitle text-muted fs-6 mb-2 fw-normal">Sinh viên</h3>
                        <p class="card-text fs-2 fw-bold text-dark mb-3">128</p>
                        <figure class="progress-bar-bg m-0">
                            <figcaption class="visually-hidden">Tiến độ sinh viên 50%</figcaption>
                            <mark class="d-block progress-bar-fill bg-primary" style="width: 50%;"></mark>
                        </figure>
                    </section>
                </article>

                <article class="col-md-3">
                    <section class="card border-0 shadow-sm p-3 h-100">
                        <h3 class="card-subtitle text-muted fs-6 mb-2 fw-normal">Đã nộp</h3>
                        <p class="card-text fs-2 fw-bold text-dark mb-3">96</p>
                        <figure class="progress-bar-bg m-0">
                            <figcaption class="visually-hidden">Tiến độ đã nộp 75%</figcaption>
                            <mark class="d-block progress-bar-fill bg-success" style="width: 75%;"></mark>
                        </figure>
                    </section>
                </article>

                <article class="col-md-3">
                    <section class="card border-0 shadow-sm p-3 h-100">
                        <h3 class="card-subtitle text-muted fs-6 mb-2 fw-normal">Chưa nộp</h3>
                        <p class="card-text fs-2 fw-bold text-dark mb-3">32</p>
                        <figure class="progress-bar-bg m-0">
                            <figcaption class="visually-hidden">Tiến độ chưa nộp 25%</figcaption>
                            <mark class="d-block progress-bar-fill bg-danger" style="width: 25%;"></mark>
                        </figure>
                    </section>
                </article>

                <article class="col-md-3">
                    <section class="card border-0 shadow-sm p-3 h-100">
                        <h3 class="card-subtitle text-muted fs-6 mb-2 fw-normal">Điểm TB</h3>
                        <p class="card-text fs-2 fw-bold text-dark mb-3">7.8</p>
                        <figure class="progress-bar-bg m-0">
                            <figcaption class="visually-hidden">Điểm trung bình 78%</figcaption>
                            <mark class="d-block progress-bar-fill bg-warning" style="width: 78%;"></mark>
                        </figure>
                    </section>
                </article>

            </section>

            <section class="card border-0 shadow-sm p-3">
                <h3 class="h6 fw-bold text-dark mb-3">Tiến độ theo chương</h3>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center px-1 py-3">
                        <span class="fw-medium text-secondary">Chương 1 — HTML5</span>
                        <span class="badge bg-success px-2 py-1">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-1 py-3">
                        <span class="fw-medium text-secondary">Chương 2 — JavaScript</span>
                        <span class="badge bg-info text-white px-2 py-1">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-1 py-3">
                        <span class="fw-medium text-secondary">Chương 3 — CSS3</span>
                        <span class="badge bg-info text-white px-2 py-1">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-1 py-3">
                        <span class="fw-medium text-secondary">Chương 4 — Bootstrap 5</span>
                        <span class="badge bg-secondary px-2 py-1">45%</span>
                    </li>
                </ul>
            </section>

        </main>

    </section>

</body>
</html>
