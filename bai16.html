<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách việc cần làm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style16.css">
</head>
<body>
    <div class="app-card">
        <div class="app-header">
            <h1 class="h4 fw-bold mb-2">Danh sách việc cần làm</h1>
            <p class="mb-0 small opacity-75">Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="p-4 border-bottom">
            <div class="input-group">
                <input type="text" id="taskInput" class="form-control" placeholder="Hoàn thành bài tập Lập trình Web">
                <button class="btn custom-btn px-4" id="addBtn">Thêm</button>
            </div>
        </div>

        <ul class="list-unstyled mb-0" id="taskList" style="max-height: 350px; overflow-y: auto;">
        </ul>

        <div class="app-footer" id="taskCounter">
            Còn 2 việc chưa hoàn thành
        </div>
    </div>
    <script src="javascript/bai16.js"></script>
</body>
</html>
