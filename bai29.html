<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style29.css">
</head>
<body>

    <main class="custom-card">
        
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 fw-bold text-dark">Danh sách sinh viên</h1>
            <span class="badge badge-total text-white">Tổng: 42</span>
        </header>

        <section class="table-responsive mb-4">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col" style="width: 50px;">#</th>
                        <th scope="col">Mã SV</th>
                        <th scope="col">Họ và tên</th>
                        <th scope="col">Lớp</th>
                        <th scope="col" class="text-center-col">Điểm</th>
                        <th scope="col">Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                </tbody>
            </table>
        </section>

        <nav aria-label="Điều hướng trang sinh viên" class="d-flex justify-content-center">
            <ul class="pagination mb-0" id="pagination">
            </ul>
        </nav>

    </main>

    <script src="javascript/bai29.js"></script>
</body>
</html>
