<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles23.css">
</head>
<body class="bg-light py-5">
    <main class="container">
        <header class="text-center mb-5">
            <h1 class="fw-bold fs-2 text-dark">Thư viện ảnh — Hiệu ứng Hover</h1>
            <p class="text-muted">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </header>

        <section class="photo-grid">
            <article class="photo-card">
                <figure>
                    <img src="images/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                    <figcaption>Vịnh Hạ Long</figcaption>
                </figure>
            </article>

            <article class="photo-card">
                <figure>
                    <img src="images/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                    <figcaption>Hang Sơn Đoòng</figcaption>
                </figure>
            </article>

            <article class="photo-card">
                <figure>
                    <img src="images/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                    <figcaption>Thác Bản Giốc</figcaption>
                </figure>
            </article>

            <article class="photo-card">
                <figure>
                    <img src="images/4-fansipan.jpg" alt="Fansipan">
                    <figcaption>Fansipan</figcaption>
                </figure>
            </article>

            <article class="photo-card">
                <figure>
                    <img src="images/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                    <figcaption>Đồng bằng sông Cửu Long</figcaption>
                </figure>
            </article>

            <article class="photo-card">
                <figure>
                    <img src="images/6-phong-nha.jpg" alt="Động Phong Nha">
                    <figcaption>Động Phong Nha</figcaption>
                </figure>
            </article>
        </section>
    </main>
</body>
</html>
